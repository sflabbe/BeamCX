name: Lua and UI smoke tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python3 -m pip install sympy==1.13.3
      - name: Install Lua runtime used by test harness
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-0 lua5.1
      - name: Generate the TI-Lua bundle
        run: python3 build.py
      - name: Check Lua 5.1 syntax and run analytical/UI regressions
        run: |
          luac5.1 -p BeamCX.lua
          lua5.1 tests/quick_check.lua "$PWD"
      - name: Run mechanics, catalogue and drawing tests
        run: |
          set -e
          for test in tests/test_*.py; do
            echo "Running $test"
            python3 "$test"
          done
